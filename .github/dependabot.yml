# Конфигурация Dependabot
# Документация: https://docs.github.com/code-security/dependabot/dependabot-options-reference
version: 2
updates:
  # Зависимости сайта документации (Docusaurus, npm) в каталоге /website
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 5
    target-branch: "develop"
    commit-message:
      prefix: "chore(website)"
      prefix-development: "chore(website-dev)"
      include: "scope"
    labels:
      - "dependencies"
      - "website"
    groups:
      # Минорные и патч-обновления — одним PR, чтобы не заваливать репозиторий
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Мажорные версии Docusaurus обновляем вручную (требуют миграции конфигурации)
      - dependency-name: "@docusaurus/*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "react"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "react-dom"
        update-types:
          - "version-update:semver-major"
