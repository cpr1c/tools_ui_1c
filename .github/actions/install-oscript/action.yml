name: Установка независимого дистрибутива Оскрипт
description: Установка независимого дистрибутива Оскрипт без использования  otymko/setup-onescript
inputs:
  version:
    description: 'Версия'
    required: true
    default: "2.2.0"
runs:
  using: "composite"
  steps:
    - name: Установка oscript
      shell: bash
      run: |
        curl -L https://github.com/EvilBeaver/OneScript/releases/download/v2.2.0/OneScript-${{inputs.version}}-${{case(runner.os == 'Linux', 'linux', 'win')}}-x64.zip --output oscript.zip
        unzip -o oscript.zip -d "$HOME/oscript"
        echo "$HOME/oscript/bin" >> "$GITHUB_PATH"
    - name: Установка перенной PATH на Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        "$env:USERPROFILE\oscript\bin" | Out-File -FilePath "$env:GITHUB_PATH" -Append

    - name: Установка прав выполнения
      if: runner.os == 'Linux'
      shell: bash
      run: |
        chmod +x $HOME/oscript/bin/oscript
        chmod +x $HOME/oscript/bin/opm
    
    - name: Установка зависимостей Oscript 
      shell: pwsh
      run: opm.bat install cli fs logos tempfiles v8runner v8find 1commands 1connector

