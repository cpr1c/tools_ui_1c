name: Установка независимого дистрибутива Оскрипт
description: Установка независимого дистрибутива Оскрипт без использования  otymko/setup-onescript
inputs:
  version:
    description: 'Версия'
    required: true
    default: "2.2.0"
runs:
  using: "composite"
  steps:
    - name: Установка oscript
      shell: bash
      run: |
        mkdir "$HOME/bin" 
        mkdir tmp 
        curl -L https://github.com/EvilBeaver/OneScript/releases/download/v2.2.0/OneScript-${{inputs.version}}-${{case(runner.os == 'Linux', 'linux', 'win')}}-x64.zip --output tmp/oscript.zip
        unzip -o tmp/oscript.zip -d "$HOME/bin/oscript" 
        echo "$HOME/bin/oscript/bin" >> "$GITHUB_PATH"

    - name: Установка прав выполнения
      if: runner.os == 'Linux'
      shell: bash
      run: |
        chmod +x $HOME/bin/oscript/bin/oscript
        chmod +x $HOME/bin/oscript/bin/opm

