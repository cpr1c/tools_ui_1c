name: Сборка файлов поставки

on:
  workflow_call:
    inputs:
      build_cf:
        required: false
        description: Собирать конфигурации
        type: boolean
        default: true
      build_portable:
        required: false
        description: Собирать портативную версию
        type: boolean
        default: true
      checkout_ref:
        required: false
        description: >-
          Ref с метаданными для job'а «Экспорт исходников в формате конфигуратора».
          Для PR передаётся refs/pull/<N>/merge: из него берутся только метаданные проектов
          Инструменты и Портативный (src/<проект>/src); сборщик, модульные тесты и настройки
          проектов EDT берутся из коммита события.
          Пустое значение — всё из коммита события (ветка или тег запуска).
          Остальные job'ы всегда извлекают ветку develop.
        type: string
        default: ""

    # Секреты нужны ТОЛЬКО для скачивания дистрибутивов при холодном кэше.
    # PR-контур (run-tests-pr.yml) вызывает этот workflow БЕЗ секретов:
    # инструменты восстанавливаются из actions/cache, прогретого доверенным
    # build-dev-version-files.yml на push в develop. Так недоверенный код PR
    # никогда не получает доступ к учётным данным портала 1С.
    secrets:
      ONEC_USERNAME:
        description: "Имя пользователя портала 1С для скачивания дистрибутивов"
        required: false
      ONEC_PASSWORD:
        description: "Пароль пользователя портала 1С для скачивания дистрибутивов"
        required: false

# Job'ы этого workflow не публикуют ничего от имени репозитория:
# токен нужен только на чтение, чтобы ограничить последствия исполнения кода PR.
permissions:
  contents: read

jobs:
  export-xml:
    name: Экспорт исходников в формате конфигуратора
    runs-on: ubuntu-24.04
    # if: github.repository == 'cpr1c/tools_ui_1c'
    env:
      TOOLS_UI_1C_BUILDER_EDT_PATH: "/opt/1C/1CE/components/1c-edt-2025.2.6+4-x86_64/"
    defaults:
      run:
        shell: bash
    steps:
      - name: Извлечение исходников (${{ github.ref }})
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Извлечение исходников PR (${{ inputs.checkout_ref }})
        if: inputs.checkout_ref != ''
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref }}
          path: pr-sources
          sparse-checkout: |
            src/Инструменты/src
            src/Портативный/src
          sparse-checkout-cone-mode: false
          allow-unsafe-pr-checkout: true
          persist-credentials: false

      - name: Подстановка метаданных PR
        if: inputs.checkout_ref != ''
        run: |
          for project in Инструменты Портативный; do
            rm -rf "src/$project/src"
            cp -r "pr-sources/src/$project/src" "src/$project/src"
          done
          rm -rf pr-sources

      - name: JAVA
        uses: actions/setup-java@v5
        with:
          distribution: "zulu" # See 'Supported distributions' for available options
          java-version: "17"

      - name: Установка 1C:EDT
        uses: 1CDevFlow/onec-setup-action@main
        with:
          type: edt
          edt_version: 2025.2.6
          cache: true
        env:
          ONEC_USERNAME: ${{ secrets.ONEC_USERNAME }}
          ONEC_PASSWORD: ${{ secrets.ONEC_PASSWORD }}
        timeout-minutes: 30

      - name: Установка оскрпит
        uses: LevkinSergey/gh-actions/install-oscript@v1
        with:
          version: 2.2.0

      - name: Конвертация исходников
        shell: bash
        run: oscript -encoding=utf-8 ./src/builder/build.os xml

      - name: Публикация исходников в формате конфигуратора
        uses: actions/upload-artifact@v4
        with:
          name: designer-src
          path: build/source
          if-no-files-found: error
          retention-days: 1

  build-cf-cfe:
    name: Сборка файлов инструментов cfe/cf
    runs-on: ubuntu-22.04
    needs: export-xml
    env:
      TOOLS_UI_1C_BUILDER_PLATFORM_PATH: "/opt/1C/v8.3/x86_64/"

    steps:
      - name: Извлечение исходников (develop)
        uses: actions/checkout@v6
        with:
          ref: develop
          persist-credentials: false

      - name: Загрузка исходников в формате конфигуратора
        uses: actions/download-artifact@v4
        with:
          name: designer-src
          path: build/source

      - name: Установка 1С:Предприятие 8.3.17.2760
        uses: 1CDevFlow/onec-setup-action@main
        with:
          type: onec
          onec_version: 8.3.17.2760
          cache: true
        env:
          ONEC_USERNAME: ${{ secrets.ONEC_USERNAME }}
          ONEC_PASSWORD: ${{ secrets.ONEC_PASSWORD }}
        timeout-minutes: 10

      - name: Установка оскрпит
        uses: LevkinSergey/gh-actions/install-oscript@v1
        with:
          version: 2.2.0

      - name: Сборка расширений
        run: oscript -encoding=utf-8 ./src/builder/build.os cfe
        timeout-minutes: 30

      - name: Сборка конфигураций
        if: ${{ inputs.build_cf}}
        run: oscript -encoding=utf-8 ./src/builder/build.os cf
        timeout-minutes: 30

      - name: Публикация артефактов
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            build/*.cfe
            build/*.cf
          if-no-files-found: error
          retention-days: 1

  build-portable:
    name: Сборка файлов портативной поставки
    runs-on: ubuntu-22.04
    if: ${{inputs.build_portable}}
    needs: export-xml
    env:
      TOOLS_UI_1C_BUILDER_PLATFORM_PATH: "/opt/1cv8/x86_64/8.3.27.2170/"

    steps:
      - name: Извлечение исходников (develop)
        uses: actions/checkout@v6
        with:
          ref: develop
          persist-credentials: false

      - name: Загрузка исходников в формате конфигуратора
        uses: actions/download-artifact@v4
        with:
          name: designer-src
          path: build/source

      - name: Установка 1С:Предприятие 8.3.27.2170
        uses: 1CDevFlow/onec-setup-action@main
        with:
          type: onec
          onec_version: 8.3.27.2170
          cache: true
        env:
          ONEC_USERNAME: ${{ secrets.ONEC_USERNAME }}
          ONEC_PASSWORD: ${{ secrets.ONEC_PASSWORD }}
        timeout-minutes: 10

      - name: Установка оскрпит
        uses: LevkinSergey/gh-actions/install-oscript@v1
        with:
          version: 2.2.0

      - name: Сборка портативной
        run: oscript -encoding=utf-8 src/builder/build.os epf
        timeout-minutes: 30

      - name: Публикация артефактов
        uses: actions/upload-artifact@v4
        with:
          name: release-files-epf
          path: build/*.epf
          if-no-files-found: error
          retention-days: 1
          overwrite: true
