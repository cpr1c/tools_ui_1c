name: Проверка Sonar (PR)

permissions:
  contents: read
  issues: write
  pull-requests: write

on:
  pull_request_target:
    branches:
      - develop
      - master
    paths:
      - "sonar-project.properties"
      - ".bsl-language-server.json"
      - ".github/workflows/sonar-qube-pr-analysis.yml"
      - "src/**"

jobs:
  SonarQualityGate:
    name: "Проверка Sonar"
    runs-on: ubuntu-latest
    steps:
      - name: Извлечение исходников PR
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ github.event.number }}/merge # Результат слияния PR
          fetch-depth: 0 # Получение полной истории (все тэги и ветки)
          allow-unsafe-pr-checkout: true

      - name: Извлечение версии проекта
        uses: ./.github/actions/extract-version
        with:
          path: ./src/Инструменты/src
        id: extract_version

      # Анализ проекта в SonarQube (PR)
      # https://docs.sonarqube.org/latest/analysis/pull-request/
      - name: Анализ в SonarQube (pull-request ${{ github.event.number }})
        uses: sonarsource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # LC_ALL: "ru_RU.UTF-8"
        with:
          args: >
            -Dfile.encoding=UTF8
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
            -Dsonar.pullrequest.branch=${{ github.event.pull_request.head.ref }}
            -Dsonar.pullrequest.base=${{ github.event.pull_request.base.ref }}
            -Dsonar.scm.revision=${{ github.event.pull_request.head.sha }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  PublishResult:
    name: Публикация результата ревью
    runs-on: ubuntu-latest
    if: success()||failure()
    needs: [SonarQualityGate]

    steps:
      - name: Извлечение исходников
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Получение полной истории (все тэги и ветки)

      - name: Публикация результата проверки PR
        uses: 1CDevFlow/sonar-review-action@main
        with:
          sonar_branch_plugin: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
