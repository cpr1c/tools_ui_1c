name: Запуск тестов
on:
  push:
    branches-ignore:
      - "develop"
      - "master"

jobs:
  test-oscript:
    name: Тест оскрипта на Ubuntu
    runs-on: ubuntu-24.04

    steps:
      - name: Установка оскрпит
        uses: ./.github/actions/install-oscript
        with:
          version: 2.2.0
        
      - name: Тест 
        run: oscript --version
  test-oscript-win:
    name: Тест оскрипта на Ubuntu
    runs-on: windows-lastest

    steps:
      - name: Установка оскрпит
        uses: ./.github/actions/install-oscript
        with:
          version: 2.2.0
        
      - name: Тест 
        run: oscript --version
  build-files:
    uses: ./.github/workflows/build-version-files.yml
    with:
      build_cf: false
      build_portable: false
    secrets:
      ONEC_USERNAME: ${{ secrets.ONEC_USERNAME }}
      ONEC_PASSWORD: ${{ secrets.ONEC_PASSWORD }}

  run-unit-tests:
    needs: build-files
    uses: ./.github/workflows/step-run-tests.yml
    strategy:
      fail-fast: false
      matrix:
        version:
          - 8.3.27.2170
        locale:
          - ru_RU
        os:
          - windows-latest
          # - ubuntu-24.04
    with:
      v8_version: ${{ matrix.version }}
      locale: ${{ matrix.locale }}
      os: ${{ matrix.os }}
      artifact_name: release-files
    secrets: inherit

