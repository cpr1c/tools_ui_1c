name: Запуск тестов
on:
  push:
    branches-ignore:
      - "develop"
      - "master"

jobs:
  build-files:
    uses: ./.github/workflows/build-version-files.yml
    with:
      build_cf: false
      build_portable: false
    secrets:
      ONEC_USERNAME: ${{ secrets.ONEC_USERNAME }}
      ONEC_PASSWORD: ${{ secrets.ONEC_PASSWORD }}

  run-unit-tests:
    needs: build-files
    uses: ./.github/workflows/step-run-tests.yml
    strategy:
      fail-fast: false
      matrix:
        version:
          - 8.3.27.2170
        locale:
          - ru_RU
          - en_US
        os:
          - windows-latest
          - ubuntu-22.04
    with:
      v8_version: ${{ matrix.version }}
      locale: ${{ matrix.locale }}
      os: ${{ matrix.os }}
      artifact_name: build-artifacts
    secrets: inherit

