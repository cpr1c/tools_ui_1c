name: Запуск тестов
on:
  push:
    branches-ignore:
      - "develop"
      - "master"

jobs:
  pretest:
    runs-on: windows-latest
    steps:
      - name: Извлечение исходников ветки ${{ github.ref_name }}
        if: github.event_name == 'push'
        uses: actions/checkout@v6
      - name: Set locale
        shell: pwsh
        run: |
          $env:LANG = 'ru_RU.UTF-8'
          # Или просто: set LANG=ru_RU.UTF-8
      - name: Скачивание расширения UI.cfe
        shell: bash
        run: |
          mkdir build
          curl -L -o $GITHUB_WORKSPACE/build/UI.cfe "https://github.com/cpr1c/tools_ui_1c/releases/download/v26.6.1/UI.cfe"

      - name: Установка 1С:Предприятие 8.3.27.2170
        uses: 1CDevFlow/onec-setup-action@main
        with:
          type: onec
          onec_version: 8.3.27.2170
          cache: true
        env:
          ONEC_USERNAME: ${{ secrets.ONEC_USERNAME }}
          ONEC_PASSWORD: ${{ secrets.ONEC_PASSWORD }}
        timeout-minutes: 10
      
      - name: Установка оскрпит
        uses: ./.github/actions/install-oscript
        with:
          version: 2.2.0
      
      # - name: Диагностика argv ibcmd
      #   shell: pwsh
      #   run: |
      #     & "C:\Program Files\1cv8\8.3.27.2170\bin\ibcmd.exe" infobase config extension update `
      #     --name=УниверсальныеИнструменты --db-path="$env:GITHUB_WORKSPACE\build\unittests\base"


     

      - name: Подготовка информационной базы WINDOWS
        if: runner.os == 'Windows'
        shell: cmd
        env:
          TOOLS_UI_1C_BUILDER_PLATFORM_PATH: "C:\\Program Files\\1cv8\\8.3.27.2170\\bin"
          PYTHONIOENCODING: "utf-8"
          PYTHONUTF8: "1"
        run: |
          chcp 65001
          oscript -encoding=utf-8 src/builder/build.os ubase        
        timeout-minutes: 5
  build-files:
    needs: pretest
    uses: ./.github/workflows/build-version-files.yml
    with:
      build_cf: false
      build_portable: false
    secrets:
      ONEC_USERNAME: ${{ secrets.ONEC_USERNAME }}
      ONEC_PASSWORD: ${{ secrets.ONEC_PASSWORD }}

  run-unit-tests:
    needs: build-files
    uses: ./.github/workflows/step-run-tests.yml
    strategy:
      fail-fast: false
      matrix:
        version:
          - 8.3.27.2170
        locale:
          - ru_RU
        os:
          - windows-latest
          # - ubuntu-24.04
    with:
      v8_version: ${{ matrix.version }}
      locale: ${{ matrix.locale }}
      os: ${{ matrix.os }}
      artifact_name: release-files
    secrets: inherit

