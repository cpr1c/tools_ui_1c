name: Запуск тестов
on:
  pull_request_target:
    branches:
      - develop
      - master
    paths:
      - "src/Инструменты/**"
      - "src/МодульныеТесты/**"
      - "src/builder/**"
      - ".github/workflows/run-tests-pr.yml"
      - ".github/workflows/step-run-tests.yml"
      - ".github/workflows/build-version-files.yml"

# Схема проверки PR (недоверенный код — без секретов):
#   * правила CI (этот файл и вызываемые workflow) берутся из базовой ветки
#     (develop/master) — это гарантирует событие pull_request_target;
#   * исходники для экспорта в формат конфигуратора берутся из merge-коммита PR
#     (refs/pull/<N>/merge) через вход checkout_ref;
#   * НИ ОДИН job ниже не получает секреты ONEC_*: инструменты (1C:EDT и
#     платформа 1С) восстанавливаются из actions/cache, прогрев которого
#     выполняет доверенный build-dev-version-files.yml на push в develop.
#     Это исключает доступ недоверенного кода PR к учётным данным портала 1С.
#   * остальные job'ы извлекают ветку develop (скрипты сборки/тестов — из develop).
# Изменения в workflow-файлах начинают действовать только после merge в базовую ветку.
permissions:
  contents: read
  checks: write

# Отменяем устаревшие прогоны по тому же PR, чтобы не тратить раннеры и не
# держать параллельно несколько сборок недоверенного кода.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-files:
    uses: ./.github/workflows/build-version-files.yml
    with:
      build_cf: false
      build_portable: false
      checkout_ref: refs/pull/${{ github.event.pull_request.number }}/merge
    # Секреты намеренно НЕ передаются: см. описание схемы выше.

  build-unit-test-base:
    name: Подготовка базы для юнит-тестирования
    needs: build-files
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # - name: Установка русской локали для ранера
      #   shell: bash
      #   run: |
      #     sudo localedef -i ru_RU -c -f UTF-8 -A /usr/share/locale/locale.alias ru_RU.UTF-8
      #     export LANG=ru_RU.UTF-8 LC_ALL=ru_RU.UTF-8
      #     sudo locale-gen ru_RU.UTF-8

      - name: Извлечение исходников (develop)
        uses: actions/checkout@v6
        with:
          ref: develop
          # В базе будет исполняться расширение из PR: не оставляем токен в .git/config.
          persist-credentials: false
      - name: Загрузка артифактов собранные расширения
        uses: actions/download-artifact@v4
        with:
          name: release-files
          path: build

      - name: Загрузка исходников в формате конфигуратора
        uses: actions/download-artifact@v4
        with:
          name: designer-src
          path: build/source
      # Секреты не передаются: платформа берётся из кэша, прогретого на develop.
      # При холодном кэше шаг завершится ошибкой скачивания — запустите сборку develop.
      - name: Установка 1С:Предприятие 8.3.27.2170 (из кэша)
        uses: 1CDevFlow/onec-setup-action@main
        with:
          type: onec
          onec_version: 8.3.27.2170
          cache: true
        timeout-minutes: 10

      - name: Установка оскрпит
        uses: LevkinSergey/gh-actions/install-oscript@v1
        with:
          version: 2.2.0
      - name: Загрузка yaxunit
        uses: robinraju/release-downloader@v1
        with:
          repository: "bia-technologies/yaxunit"
          tag: 25.12
          fileName: YAxUnit-25.12.cfe
          out-file-path: build/unittests

      - name: Подготовка информационной базы
        shell: bash
        env:
          TOOLS_UI_1C_BUILDER_PLATFORM_PATH: "/opt/1cv8/x86_64/8.3.27.2170/"
        run: |
          export TOOLS_UI_1C_YAXUNIT_PATH="$GITHUB_WORKSPACE/build/unittests/YAxUnit-25.12.cfe"
          oscript -encoding=utf-8 src/builder/build.os ubase
        timeout-minutes: 5

      - name: Публикация базы в артефактах
        uses: actions/upload-artifact@v4
        with:
          name: unittests-base
          path: build/unittests/base.dt
          if-no-files-found: error
          retention-days: 1
  run-unit-tests:
    needs: build-unit-test-base
    uses: ./.github/workflows/step-run-tests.yml
    strategy:
      fail-fast: false
      matrix:
        version:
          - 8.3.27.2170
        locale:
          - ru_RU
        os:
          - windows-latest
          - ubuntu-24.04
    with:
      v8_version: ${{ matrix.version }}
      locale: ${{ matrix.locale }}
      os: ${{ matrix.os }}
      artifact_name: unittests-base
    # Секреты намеренно НЕ передаются: тесты исполняют недоверенный код PR.
